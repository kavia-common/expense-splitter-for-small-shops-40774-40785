# Preview configuration for the expense splitter project
# Ensures expense_database does not depend on TCP port readiness and uses command-based healthcheck.

version: "1.0"
metadata:
  name: expense-splitter-preview
  description: Preview config removing port 3020 dependency and using command-based healthcheck
  notes: |
    - expense_database starts only the SQLite initialization script (no Node.js).
    - Healthcheck is command-based via healthcheck.sh (file + connectivity check).
    - No port mappings or readiness checks for expense_database.
    - Optional db_visualizer is manual-only and excluded from startup.
    - expense_api (3001) and expense_frontend (3000) behavior is unchanged.

containers:
  expense_database:
    workspace: expense-splitter-for-small-shops-40774-40785
    context: expense-splitter-for-small-shops-40774-40785/expense_database
    type: database
    platform: sqlite
    env:
      - REACT_APP_API_BASE
      - REACT_APP_BACKEND_URL
      - REACT_APP_FRONTEND_URL
      - REACT_APP_WS_URL
      - REACT_APP_NODE_ENV
      - REACT_APP_NEXT_TELEMETRY_DISABLED
      - REACT_APP_ENABLE_SOURCE_MAPS
      - REACT_APP_PORT
      - REACT_APP_TRUST_PROXY
      - REACT_APP_LOG_LEVEL
      - REACT_APP_HEALTHCHECK_PATH
      - REACT_APP_FEATURE_FLAGS
      - REACT_APP_EXPERIMENTS_ENABLED
    buildCommand: ""
    # Start only the DB initializer; do NOT run db_visualizer or bind any port
    startCommand: "python init_db.py"
    # Command-based healthcheck (no TCP/HTTP)
    healthcheck:
      test:
        - CMD
        - bash
        - expense_database/healthcheck.sh
      interval: "10s"
      timeout: "5s"
      retries: 6
      # Inline fallback for platforms that only accept inline commands
      inlineFallback: 'sh -c "test -f expense_database/myapp.db && echo OK"'
    # Explicitly ensure there are no ports or readiness checks for this container
    ports: []
    readiness: none
    expose: false
    autoStart: true

  # Keep db_visualizer present for manual/local use but not part of startup.
  db_visualizer (manual-only):
    workspace: expense-splitter-for-small-shops-40774-40785
    context: expense-splitter-for-small-shops-40774-40785/expense_database/db_visualizer
    type: node
    platform: node
    description: "Optional local DB viewer. Not started automatically."
    startInstructions: |
      cd expense-splitter-for-small-shops-40774-40785/expense_database/db_visualizer
      # Ensure sqlite.env was generated by init_db.py
      # Then run locally:
      npm ci || npm install
      npm run start
      # Access: http://localhost:3020
    autoStart: false
    includeInPreview: false

  # Note: Do not modify ports for API or frontend
  expense_api:
    workspace: expense-splitter-for-small-shops-40774-40784
    context: expense-splitter-for-small-shops-40774-40784/expense_api
    type: backend
    platform: flask
    port: 3001
    autoStart: true

  expense_frontend:
    workspace: expense-splitter-for-small-shops-40774-40783
    context: expense-splitter-for-small-shops-40774-40783/expense_frontend
    type: frontend
    platform: react
    port: 3000
    autoStart: true
